<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblioteca de Jogos</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f6f7fb; color: #1f2430; margin: 0; padding: 2rem 1rem; }
  h1 { text-align: center; margin: 0 0 0.2rem; }
  p.sub { text-align: center; color: #666; margin: 0 0 2rem; }
  #status { text-align: center; color: #666; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; max-width: 900px; margin: 0 auto; }
  .jogo { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .jogo img { width: 100%; height: 120px; object-fit: cover; }
  .jogo h3 { font-size: 0.95rem; margin: 0.6rem 0.7rem 0.2rem; }
  .jogo a { display: block; margin: 0.6rem 0.7rem 0.8rem; font-size: 0.85rem; color: #4b5bfa; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
 
<h1>Biblioteca de Jogos</h1>
<p class="sub">Jogos disponíveis</p>
 
<p id="status">Carregando...</p>
<div class="grid" id="grid"></div>
 
<script>
  async function carregar() {
    const res = await fetch("https://www.gamerpower.com/api/giveaways?type=game");
    const jogos = await res.json();
    mostrar(jogos);
  }
 
  function mostrar(lista) {
    const grid = document.getElementById("grid");
    document.getElementById("status").textContent = lista.length ? "" : "Nenhum jogo encontrado.";
    grid.innerHTML = lista.slice(0, 12).map(j => `
      <div class="jogo">
        <img src="${j.thumbnail}" alt="${j.title}" onerror="this.src='https://placehold.co/300x160?text=Sem+imagem'">
        <h3>${j.title}</h3>
        <a href="${j.open_giveaway_url}" target="_blank">Resgatar →</a>
      </div>`).join("");
  }
 
  carregar();
</script>
 
</body>
</html>
